services:
  db:
    image: mariadb:11
    container_name: gsf-hub-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  wordpress:
    image: wordpress:php8.2-apache
    container_name: gsf-hub-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      GSF_SCORM_LITE_LOCAL_SMTP_HOST: mailpit
      GSF_SCORM_LITE_LOCAL_SMTP_PORT: 1025
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  mailpit:
    image: axllent/mailpit:latest
    container_name: gsf-hub-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  wpcli:
    image: wordpress:cli-php8.2
    container_name: gsf-hub-wpcli
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      GSF_SCORM_LITE_LOCAL_SMTP_HOST: mailpit
      GSF_SCORM_LITE_LOCAL_SMTP_PORT: 1025
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  db_data:
