[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsf-resource-recommender"
version = "0.1.0"
description = "A citation-first resource recommendation RAG prototype for the GSF Hub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "pypdf>=6.0",
  "python-docx>=1.1",
]

[project.scripts]
gsf-recommend = "resource_recommender.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
